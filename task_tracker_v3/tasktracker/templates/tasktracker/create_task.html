{% extends 'tasktracker/base.html' %}
{% block title %}Create Task{% endblock %}
{% block n_create %}active{% endblock %}
{% block topbar_title %}<h2>Assign Task</h2><p style="font-size:13px;color:var(--text2);">Create and assign a task to a team member</p>{% endblock %}

{% block content %}
<div class="card" style="max-width:580px;">
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Task Title *</label>
      <input type="text" name="title" class="form-ctrl" placeholder="e.g. Fix login page validation bug" required>
    </div>
    <div class="form-group">
      <label>Description *</label>
      <textarea name="description" class="form-ctrl" rows="5" placeholder="Detailed description of what needs to be done, expected output, references..." required></textarea>
    </div>
    <div class="form-group">
      <label>Assign To *</label>
      <select name="assigned_to" class="form-ctrl" required>
        <option value="">-- Select team member --</option>
        {% for u in assignable %}
        <option value="{{ u.id }}">{{ u.get_full_name|default:u.username }} ({{ u.profile.get_role_display }})</option>
        {% endfor %}
      </select>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;">
      <div class="form-group">
        <label>Priority</label>
        <select name="priority" class="form-ctrl">
          <option value="medium">Medium</option>
          <option value="high">High</option>
          <option value="low">Low</option>
        </select>
      </div>
      <div class="form-group">
        <label>Due Date (optional)</label>
        <input type="date" name="due_date" class="form-ctrl">
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:6px;">
      <a href="{% url 'dashboard' %}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary">Create & Assign →</button>
    </div>
  </form>
</div>
{% endblock %}
