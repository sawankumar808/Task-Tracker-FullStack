{% extends 'tasktracker/base.html' %}
{% block title %}Create Project{% endblock %}
{% block topbar_title %}<h2>Create Project</h2><p style="font-size:13px;color:var(--text2);">Set up a new project for your team</p>{% endblock %}

{% block content %}
<div class="card" style="max-width:580px;">
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label>Project Name *</label>
      <input type="text" name="name" class="form-ctrl" placeholder="e.g. E-commerce Website Redesign" required>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea name="description" class="form-ctrl" rows="3" placeholder="Brief description of the project goals..."></textarea>
    </div>
    <div class="form-group">
      <label>Due Date (optional)</label>
      <input type="date" name="due_date" class="form-ctrl">
    </div>
    <div class="form-group">
      <label>Team Members</label>
      <div style="background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:12px;max-height:200px;overflow-y:auto;">
        {% for user in all_users %}
        <label style="display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer;font-size:13px;color:var(--text);">
          <input type="checkbox" name="members" value="{{ user.id }}" style="width:auto;margin-bottom:0;">
          {{ user.get_full_name|default:user.username }}
          <span style="font-size:11px;color:var(--text2);">({{ user.profile.get_role_display }})</span>
        </label>
        {% endfor %}
      </div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:6px;">
      <a href="{% url 'projects' %}" class="btn btn-outline">Cancel</a>
      <button type="submit" class="btn btn-primary">Create Project →</button>
    </div>
  </form>
</div>
{% endblock %}
